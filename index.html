<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>DPL Stats</title>
  <link rel="stylesheet" href="app.css">
  <style>
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .lock { max-width: 420px; margin: 8vh auto 0; text-align: center; }
    .lock form { text-align: left; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tabs button.on { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
    .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
    .list button { justify-content: flex-start; min-height: 52px; }
    .head { display: flex; gap: 16px; align-items: center; }
    .avatar { width: 72px; height: 72px; border-radius: 50%; border: 3px solid var(--gold); display: grid; place-items: center; font-size: 36px; color: var(--gold); background: var(--bg-2); flex: none; }
    .tiles4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    @media (max-width: 600px) { .tiles4 { grid-template-columns: repeat(2, 1fr); } }
    .tile .v { font-size: 28px; }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; font-weight: 700; text-align: right; }
    .scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { color: var(--muted); font-size: 13px; }
    td.n, th.n { text-align: right; }
    tr[data-p] { cursor: pointer; }
    .err { color: var(--red-hi); font-weight: 700; min-height: 1.4em; }
    .check { display: flex; gap: 10px; align-items: center; font-weight: 600; margin-top: 12px; }
    .check input { width: 22px; height: 22px; }
    svg.race { width: 100%; height: auto; display: block; }
    svg.race text { fill: var(--muted); font-size: 12px; }
    svg.race .grid { stroke: var(--line); stroke-width: 1; }
    svg.race polyline { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 8px; vertical-align: -2px; }
    .h2pick { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
    .h2pick .vs { font-weight: 800; color: var(--gold); }
    .h2row { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 8px; align-items: center; text-align: center;
             padding: 10px 0; border-top: 1px solid var(--line); }
    .h2row.names { border-top: 0; font-size: 18px; padding-bottom: 0; }
    .h2row .k { font-size: 13px; font-weight: 700; color: var(--muted); }
    .h2row .k .muted { font-weight: 400; font-size: 12px; }
    .h2row .v { font-weight: 800; font-size: 26px; }
    .h2row .s { font-size: 12px; color: var(--muted); }
    .h2row .lead .v { color: var(--gold); }
    .hofgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .hofrow { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); cursor: pointer; }
    .hofrow .rk { font-weight: 800; color: var(--muted); }
    .hofrow .v { font-weight: 800; font-size: 20px; text-align: right; }
    .hofrow.first .rk, .hofrow.first .v { color: var(--gold); }
  </style>
</head>
<body>
  <main class="wrap stack">
    <div class="top">
      <img class="logo" src="logo.svg" alt="DPL, Duggleby Poker League">
      <button id="forget" hidden>Lock</button>
    </div>
    <section id="lock" class="lock panel stack" hidden>
      <h1>Duggleby Poker League stats</h1>
      <form id="unlock" class="stack">
        <label for="pw">League password</label>
        <input id="pw" type="password" autocomplete="current-password" required>
        <label class="check"><input id="remember" type="checkbox"> Remember on this device</label>
        <p class="err" id="err" role="alert"></p>
        <button class="primary" id="go" type="submit">Unlock</button>
      </form>
      <p class="muted">Ask the league admin for the password.</p>
    </section>
    <section id="app" class="stack" hidden></section>
  </main>
  <script src="site.js"></script>
</body>
</html>
